aid: kango
name: Kango
description: Kango is an on-demand rides and childcare platform for families, connecting parents and schools
  with background-checked, fingerprinted drivers and sitters who transport and care for children from preschool
  through high school. Operated by Dolightful, Inc. and backed by 500 Global, Kango offers prescheduled and
  same-day rides, real-time ride tracking, in-app communication with drivers, provided car and booster seats,
  in-home sitter sessions, and a free carpool feature promoted by schools and camps. It runs on iOS and Android
  apps using a subscription plus per-ride and per-session fee model. Kango is a consumer mobile product and
  publishes no public developer API, SDK, or documentation surface at this time.
